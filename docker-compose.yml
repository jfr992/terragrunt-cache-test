# Optional: Floci local AWS emulator for BACKEND=floci (S3 state). Never real cloud.
services:
  floci:
    image: floci/floci:latest
    ports: ["127.0.0.1:4566:4566"]
  floci-setup:
    image: amazon/aws-cli:latest
    depends_on: [floci]
    network_mode: host
    environment: { AWS_ACCESS_KEY_ID: test, AWS_SECRET_ACCESS_KEY: test, AWS_DEFAULT_REGION: us-east-1 }
    command: ["--endpoint-url", "http://127.0.0.1:4566", "s3", "mb", "s3://tg-bench-state"]
